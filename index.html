<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CWHF Coherence Lab — Living H1 Test</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#F9F8F6;--sf:#fff;--sf2:#F4F3F0;--br:rgba(15,15,10,.08);--brk:rgba(15,15,10,.16);
  --ink:#0F0F0D;--i2:#4A4A47;--i3:#8A8A87;--i4:#B8B8B5;
  --t:#0B6E58;--tl:#E8F5F1;--tx:#F2FAF7;
  --a:#A85A0A;--al:#FEF3E7;
  --r:#B83232;--rl:#FEF0F0;
  --b:#1A5FA8;--bl:#EEF4FE;
  --p:#6B4EC6;--pl:#F1EEFE;
  --nav:58px;--max:1080px;--gap:18px;
  --fh:'Sora',sans-serif;--fb:'Plus Jakarta Sans',sans-serif;--fm:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.4,0,.2,1);
  --L1:#0B6E58;--L2:#1A5FA8;--L3:#A85A0A;--L4:#6B4EC6;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;-webkit-text-size-adjust:100%}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--tl)}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;height:var(--nav);background:rgba(249,248,246,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--br);z-index:1000;display:flex;align-items:center;padding:0 22px;gap:0}
.brand{font-family:var(--fh);font-size:15px;font-weight:700;letter-spacing:-.02em;margin-right:28px;flex-shrink:0}
.brand em{color:var(--t);font-style:normal}
.nav-links{display:flex;gap:3px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nb{padding:6px 13px;border-radius:7px;border:none;background:transparent;color:var(--i3);font-size:12px;font-weight:500;font-family:var(--fb);white-space:nowrap;transition:all .14s}
.nb:hover{background:var(--sf2);color:var(--ink)}
.nb.on{background:var(--tl);color:var(--t);font-weight:600}
.nav-r{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.mpill{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--br);background:var(--sf2)}
.mpill button{padding:5px 12px;border:none;background:transparent;font-size:11px;font-weight:700;color:var(--i3);font-family:var(--fm);transition:all .14s}
.mpill button.on{background:var(--t);color:#fff}
.mpill button.mon{background:var(--i2);color:#fff}
.lsel{padding:5px 8px;border:1px solid var(--br);border-radius:6px;background:var(--sf);font-size:11px;color:var(--i3);font-family:var(--fb);cursor:pointer;outline:none}

/* LAYOUT */
.main{margin-top:var(--nav)}
.page{display:none}.page.on{display:block}
.wrap{max-width:var(--max);margin:0 auto;padding:0 22px 100px}
.wrap-s{max-width:700px;margin:0 auto;padding:0 22px 100px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}

/* CARDS */
.card{background:var(--sf);border:1px solid var(--br);border-radius:12px;padding:18px 20px}
.card-s{background:var(--sf);border:1px solid var(--br);border-radius:9px;padding:12px 15px}
.ct{background:var(--tx);border-color:rgba(11,110,88,.12)}
.ca{background:var(--al);border-color:rgba(168,90,10,.12)}
.cr{background:var(--rl);border-color:rgba(184,50,50,.12)}

/* SECTION LABELS */
.sl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sl::before{content:'';width:18px;height:1.5px;background:var(--t)}

/* METRIC CELLS */
.mc{padding:14px 16px;background:var(--sf2);border-radius:10px}
.mn{font-family:var(--fm);font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1;margin-bottom:3px}
.ml{font-size:11px;color:var(--i3);line-height:1.4}
.mbar{height:3px;background:var(--br);border-radius:2px;margin-top:7px}
.mbf{height:3px;border-radius:2px;transition:width .5s var(--ease)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:9px;border:none;font-size:13px;font-weight:600;font-family:var(--fb);cursor:pointer;transition:all .14s;white-space:nowrap}
.bp{background:var(--t);color:#fff}.bp:hover{background:#085041;transform:translateY(-1px);box-shadow:0 4px 12px rgba(11,110,88,.28)}
.bs{background:var(--tl);color:var(--t);border:1px solid rgba(11,110,88,.18)}.bs:hover{background:var(--t);color:#fff}
.bg{background:transparent;color:var(--i2);border:1px solid var(--br)}.bg:hover{background:var(--sf2)}
.bsm{padding:7px 14px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:default;transform:none!important;box-shadow:none!important}

/* TAB BAR */
.tbar{position:sticky;top:var(--nav);z-index:90;background:rgba(249,248,246,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--br);padding:0 22px}
.tbar-i{max-width:var(--max);margin:0 auto;display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
.tbar-i::-webkit-scrollbar{display:none}
.tb{padding:12px 16px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--i3);font-size:12px;font-weight:500;font-family:var(--fb);cursor:pointer;white-space:nowrap;transition:all .14s}
.tb:hover{color:var(--ink)}.tb.on{color:var(--t);border-bottom-color:var(--t);font-weight:600}
.tp{display:none}.tp.on{display:block}

/* TABLES */
.dt{width:100%;border-collapse:collapse;font-size:12px}
.dt th{text-align:left;padding:8px 10px;background:var(--sf2);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--i3);border-bottom:1px solid var(--br)}
.dt td{padding:8px 10px;border-bottom:1px solid var(--br);color:var(--i2);vertical-align:top}
.dt tr:last-child td{border-bottom:none}
.dt tr:hover td{background:var(--tx)}

/* CODE */
.code{font-family:var(--fm);font-size:12px;line-height:1.8;background:#0D1117;color:#C9D1D9;border-radius:10px;padding:16px 18px;overflow-x:auto;white-space:pre}

/* BADGES */
.bl{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;font-family:var(--fm);text-transform:uppercase;background:var(--tl);color:var(--t)}
.bl::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--t);animation:blink 2s infinite}
.bm{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;font-family:var(--fm);text-transform:uppercase;background:#E8E7E4;color:var(--i2)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* LAYER BADGES */
.layer-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;font-family:var(--fm)}
.l1b{background:rgba(11,110,88,.1);color:var(--L1)}
.l2b{background:rgba(26,95,168,.1);color:var(--L2)}
.l3b{background:rgba(168,90,10,.1);color:var(--L3)}
.l4b{background:rgba(107,78,198,.1);color:var(--L4)}

/* WIZARD */
.wdots{display:flex;gap:5px;align-items:center;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.wd{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:10px;font-weight:500;border:1.5px solid var(--br);background:var(--bg);color:var(--i3);transition:all .22s}
.wd.done{background:var(--t);border-color:var(--t);color:#fff}
.wd.curr{background:var(--sf);border-color:var(--t);color:var(--t)}
.wline{width:18px;height:1.5px;background:var(--br);border-radius:1px;transition:background .22s}
.wline.done{background:var(--t)}
.ws{display:none}.ws.on{display:block}

/* SESSION UI */
.task-card{border:1px solid var(--br);border-radius:12px;padding:20px;background:var(--sf)}
.tprog{height:3px;background:var(--br);border-radius:2px;margin-bottom:18px}
.tprogf{height:3px;border-radius:2px;background:var(--t);transition:width .35s}
.tmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ttext{background:var(--sf2);border-radius:8px;padding:13px 15px;font-size:13px;color:var(--ink);line-height:1.7;margin-bottom:14px;border-left:3px solid var(--br)}
.ttext.gold{border-left-color:var(--t)}
.rbrow{display:flex;gap:7px}
.rb{width:44px;height:44px;border-radius:8px;border:1.5px solid var(--br);background:var(--sf);font-size:14px;font-weight:600;font-family:var(--fm);color:var(--i2);cursor:pointer;transition:all .12s}
.rb:hover{border-color:var(--t);background:var(--tl);color:var(--t)}
.rb.sel{background:var(--t);border-color:var(--t);color:#fff}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:2px}
.pb{padding:13px 15px;border-radius:9px;border:1.5px solid var(--br);background:var(--sf);font-size:12px;color:var(--i2);text-align:left;cursor:pointer;line-height:1.55;transition:all .12s}
.pb:hover,.pb.sel{border-color:var(--t);background:var(--tl);color:var(--t)}

/* SCORE DONUT */
.donut{position:relative;width:140px;height:140px;margin:0 auto}
.donut svg{transform:rotate(-90deg)}
.donut-in{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.sv{font-family:var(--fm);font-size:36px;font-weight:500;letter-spacing:-.02em;line-height:1}
.sl2{font-size:10px;color:var(--i3);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}

/* MERKLE */
.mhash{font-family:var(--fm);font-size:10px;padding:4px 9px;border-radius:4px;border:1px solid var(--br);background:var(--sf2);display:inline-block;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mhash.root{background:var(--tl);border-color:rgba(11,110,88,.3);color:var(--t);font-weight:600}

/* SECTION */
.sec{padding:40px 0 0}

/* NOTIFICATION */
.notif{position:fixed;bottom:22px;right:22px;z-index:9999;background:var(--ink);color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;font-weight:500;max-width:310px;line-height:1.5;transform:translateY(20px);opacity:0;transition:all .22s;pointer-events:none}
.notif.on{transform:translateY(0);opacity:1}
.div{height:1px;background:var(--br);margin:36px 0}

/* ICC CHART SPECIAL */
.icc-bar{height:8px;border-radius:4px;background:var(--br);overflow:hidden;margin-top:4px}
.icc-fill{height:8px;border-radius:4px;transition:width .6s var(--ease)}

/* LAYER PROGRESS */
.lp-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lp-label{font-size:11px;font-weight:600;min-width:90px}
.lp-bar{flex:1;height:5px;background:var(--br);border-radius:3px;overflow:hidden}
.lp-fill{height:5px;border-radius:3px;transition:width .4s}
.lp-n{font-size:10px;color:var(--i3);font-family:var(--fm);min-width:30px;text-align:right}

/* HEATMAP */
.hc{width:40px;height:33px;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:10px;font-weight:500;color:rgba(255,255,255,.95);border:1.5px solid transparent;flex-shrink:0;transition:transform .12s,box-shadow .12s}
.hc:hover{transform:scale(1.25);box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:5;position:relative}
.hc.sel{border-color:rgba(0,0,0,.5)!important;transform:scale(1.12)}

/* HERO */
.hero{padding:56px 0 44px;border-bottom:1px solid var(--br)}
.heyebrow{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t);margin-bottom:16px;display:flex;align-items:center;gap:9px}
.heyebrow::before{content:'';width:22px;height:1.5px;background:var(--t)}
.formula{font-family:var(--fm);font-size:clamp(14px,2.2vw,20px);font-weight:500;color:var(--i2);margin:18px 0;letter-spacing:-.01em;border-left:3px solid var(--t);padding:11px 16px;background:var(--tx);border-radius:0 8px 8px 0;display:inline-block}

/* RESPONSIVE */
@media(max-width:768px){.g2,.g3,.g4{grid-template-columns:1fr}.pgrid{grid-template-columns:1fr}.hero{padding:36px 0 28px}.wrap,.wrap-s{padding:0 15px 80px}.tbar{padding:0 15px}.nav{padding:0 14px}.brand{margin-right:16px}}
@media(max-width:480px){.mpill button{padding:5px 8px;font-size:9px}}
</style>
</head>
<body>
<nav class="nav">
  <a class="brand"><em>CWHF</em> Coherence Lab</a>
  <div class="nav-links">
    <button class="nb on" onclick="nav(0)">Thesis</button>
    <button class="nb" onclick="nav(1)">Simulate</button>
    <button class="nb" onclick="nav(2)">Experiment</button>
    <button class="nb" onclick="nav(3)">Architecture</button>
    <button class="nb" onclick="nav(4)">Research</button>
  </div>
  <div class="nav-r">
    <div class="mpill">
      <button id="bmk" onclick="setMode('mock')">MOCK</button>
      <button id="blv" class="on" onclick="setMode('live')">LIVE</button>
    </div>
    <select class="lsel" onchange="notifyLang(this.value)">
      <option value="en">EN 🌐</option><option value="hi">HI 🇮🇳</option>
      <option value="es">ES 🇪🇸</option><option value="fr">FR 🇫🇷</option>
      <option value="ar">AR 🇸🇦</option><option value="zh">ZH 🇨🇳</option>
    </select>
  </div>
</nav>
<main class="main">
  <div class="page on" id="pg0"></div>
  <div class="page" id="pg1"></div>
  <div class="page" id="pg2"></div>
  <div class="page" id="pg3"></div>
  <div class="page" id="pg4"></div>
</main>
<div class="notif" id="notif"></div>

<script>
'use strict';
// ── CONSTANTS ──────────────────────────────────────────────────────
const DB='CWHF_H1_v1';
let db=null, currentPage=0, currentMode='live', charts={};

// ── COLOUR SYSTEM ──────────────────────────────────────────────────
function tc(c){return c>=.72?'#0B6E58':c>=.55?'#A85A0A':c>=.38?'#B83232':'#7B1A1A'}
function tbg(c){return c>=.72?'#E8F5F1':c>=.55?'#FEF3E7':c>=.38?'#FEF0F0':'#FEEBEB'}
function tlbl(c){return c>=.72?'High':c>=.55?'Medium':c>=.38?'Drift':'Severe'}
const LC={'L1':'#0B6E58','L2':'#1A5FA8','L3':'#A85A0A','L4':'#6B4EC6'};
const LBG={'L1':'#E8F5F1','L2':'#EEF4FE','L3':'#FEF3E7','L4':'#F1EEFE'};
const LNAME={'L1':'Survival/Safety','L2':'Functional/Social','L3':'Cognitive/Epistemic','L4':'Meta/Reflective'};

// ─────────────────────────────────────────────────────────────────
// 80-QUESTION BANK — The H1 Research Instrument
// ─────────────────────────────────────────────────────────────────
// type: 'gold' = known correct answer | 'value' = consistency measured
// gold_dir: 'high'=rate 4-5 correct | 'low'=rate 1-2 correct
// anchor: true = appears every session (used for ICC computation)
// format: 'rating' (1-5) | 'pairwise' (A/B choice)
// ─────────────────────────────────────────────────────────────────
const QB = [

// ══ LAYER 1: SURVIVAL / SAFETY ════════════════════════════════════
// Hypothesis: most primitive layer — should show LEAST drift with cognitive state

// Gold items — factual accuracy tests
{id:'G1_1',l:'L1',type:'gold',anchor:false,format:'rating',gold:'high',
 text:'Vaccines containing mRNA do not alter human DNA.'},
{id:'G1_2',l:'L1',type:'gold',anchor:false,format:'rating',gold:'high',
 text:'The human brain uses approximately 20% of the body\'s total energy despite being ~2% of body weight.'},
{id:'G1_3',l:'L1',type:'gold',anchor:true,format:'rating',gold:'high',
 text:'Research shows that hunger (food deprivation) increases impulsive and risky decision-making.'},
{id:'G1_4',l:'L1',type:'gold',anchor:false,format:'rating',gold:'high',
 text:'24 hours without sleep produces cognitive impairment comparable to a 0.10% blood alcohol level.'},
{id:'G1_5',l:'L1',type:'gold',anchor:false,format:'rating',gold:'high',
 text:'The fight-or-flight stress response temporarily suppresses activity in the prefrontal cortex.'},

// Value items — consistency across sessions measured
{id:'V1_1',l:'L1',type:'value',anchor:false,format:'rating',
 text:'Scarce resources should be distributed based on need rather than merit.'},
{id:'V1_2',l:'L1',type:'value',anchor:false,format:'rating',
 text:'Physical security from violence is more fundamental than economic security.'},
{id:'V1_3',l:'L1',type:'value',anchor:false,format:'rating',
 text:'Individuals have the right to take personal health risks that affect only themselves.'},
{id:'V1_4',l:'L1',type:'value',anchor:false,format:'rating',
 text:'Basic healthcare should be universally accessible regardless of ability to pay.'},
{id:'V1_5',l:'L1',type:'value',anchor:true,format:'rating',
 text:'In genuine emergencies, it is ethically defensible to prioritise saving more lives over fewer.'},
{id:'V1_6',l:'L1',type:'value',anchor:false,format:'rating',
 text:'A government\'s primary duty is to protect citizens from physical harm.'},
{id:'V1_7',l:'L1',type:'value',anchor:false,format:'rating',
 text:'Children\'s physical safety should always take precedence over parental autonomy.'},
{id:'V1_8',l:'L1',type:'value',anchor:false,format:'rating',
 text:'Sustainable resource use matters more than near-term economic growth.'},
{id:'V1_9',l:'L1',type:'value',anchor:false,format:'rating',
 text:'It is sometimes acceptable to deceive someone to protect them from physical harm.'},
{id:'V1_10',l:'L1',type:'value',anchor:false,format:'rating',
 text:'The preservation of human life outweighs nearly all other ethical considerations.'},
{id:'V1_11',l:'L1',type:'value',anchor:false,format:'rating',
 text:'People should be free to make unhealthy personal choices without government interference.'},
{id:'V1_12',l:'L1',type:'value',anchor:false,format:'rating',
 text:'Future generations have rights that should constrain the choices of current generations.'},
{id:'V1_13',l:'L1',type:'value',anchor:false,format:'rating',
 text:'Communities have a legitimate right to restrict outsider access to protect their safety.'},
{id:'V1_14',l:'L1',type:'value',anchor:false,format:'rating',
 text:'Physical pain should always be treated even when there is a risk of dependency.'},
{id:'V1_15',l:'L1',type:'value',anchor:false,format:'pairwise',
 optA:'When lives are at stake, speed of response matters more than procedural fairness.',
 optB:'Even when lives are at stake, procedural fairness should not be abandoned.'},

// ══ LAYER 2: FUNCTIONAL / SOCIAL ══════════════════════════════════
// Hypothesis: moderate drift — fairness and cooperation judgments shift under pressure

{id:'G2_1',l:'L2',type:'gold',anchor:true,format:'rating',gold:'high',
 text:'Dunbar\'s number (~150) represents the approximate cognitive limit for maintaining stable social relationships.'},
{id:'G2_2',l:'L2',type:'gold',anchor:false,format:'rating',gold:'high',
 text:'Cross-national research shows income inequality (Gini coefficient) correlates with reduced social trust.'},
{id:'G2_3',l:'L2',type:'gold',anchor:false,format:'rating',gold:'high',
 text:'Reciprocity — the norm of returning favours — is observed in all known human cultures without exception.'},
{id:'G2_4',l:'L2',type:'gold',anchor:false,format:'rating',gold:'high',
 text:'Groups make riskier decisions on average than individuals acting alone — the risky shift phenomenon.'},
{id:'G2_5',l:'L2',type:'gold',anchor:false,format:'rating',gold:'high',
 text:'Perceived fairness violations activate similar neural regions as physical disgust responses.'},

{id:'V2_1',l:'L2',type:'value',anchor:false,format:'rating',
 text:'Work performance should be evaluated on outcomes alone, not effort.'},
{id:'V2_2',l:'L2',type:'value',anchor:false,format:'rating',
 text:'Loyalty to one\'s employer is a virtue worth maintaining even at significant personal cost.'},
{id:'V2_3',l:'L2',type:'value',anchor:false,format:'rating',
 text:'Collective well-being should generally take priority over individual freedom.'},
{id:'V2_4',l:'L2',type:'value',anchor:false,format:'rating',
 text:'People who work consistently harder deserve a proportionally greater share of collective rewards.'},
{id:'V2_5',l:'L2',type:'value',anchor:false,format:'rating',
 text:'Trust, once seriously broken in a significant relationship, can rarely be fully restored.'},
{id:'V2_6',l:'L2',type:'value',anchor:false,format:'rating',
 text:'Unequal outcomes are ethically acceptable when the process that produced them was genuinely fair.'},
{id:'V2_7',l:'L2',type:'value',anchor:true,format:'rating',
 text:'On balance, people tend to receive roughly what they deserve across a lifetime.'},
{id:'V2_8',l:'L2',type:'value',anchor:false,format:'rating',
 text:'Institutions and systems matter more than individual character for determining social outcomes.'},
{id:'V2_9',l:'L2',type:'value',anchor:false,format:'rating',
 text:'Whistleblowing on organisational wrongdoing is a moral duty that overrides loyalty.'},
{id:'V2_10',l:'L2',type:'value',anchor:false,format:'rating',
 text:'Maintaining social harmony is often more important than stating uncomfortable truths.'},
{id:'V2_11',l:'L2',type:'value',anchor:false,format:'rating',
 text:'Cultural traditions deserve respect even when they conflict with individual rights.'},
{id:'V2_12',l:'L2',type:'value',anchor:false,format:'rating',
 text:'Older generations have a special moral obligation to those who will inherit their world.'},
{id:'V2_13',l:'L2',type:'value',anchor:false,format:'rating',
 text:'Volunteer work has equal moral value to equivalent paid professional contribution.'},
{id:'V2_14',l:'L2',type:'value',anchor:false,format:'rating',

// ── MATH UTILITIES ─────────────────────────────────────────────────
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function mean(arr){return arr.reduce((a,b)=>a+b,0)/arr.length}
function variance(arr){const m=mean(arr);return arr.reduce((a,b)=>a+(b-m)**2,0)/arr.length}
function stdDev(arr){return Math.sqrt(variance(arr))}
function fmt2(v){return parseFloat(v.toFixed(2))}
function fmt3(v){return parseFloat(v.toFixed(3))}
function pct(v){return Math.round(v*100)+'%'}

// Pearson correlation — the ICC measure
function pearsonR(xs,ys){
  if(xs.length<2||ys.length<2)return null;
  const mx=mean(xs),my=mean(ys);
  const num=xs.reduce((s,x,i)=>s+(x-mx)*(ys[i]-my),0);
  const den=Math.sqrt(xs.reduce((s,x)=>s+(x-mx)**2,0)*ys.reduce((s,y)=>s+(y-my)**2,0));
  return den===0?0:clamp(num/den,-1,1);
}

// Compute ICC across two sessions' anchor value items
function computeICC(sessA, sessB){
  const av=ICC_IDS.map(id=>{const r=sessA.responses.find(r=>r.qid===id);return r?.value??null});
  const bv=ICC_IDS.map(id=>{const r=sessB.responses.find(r=>r.qid===id);return r?.value??null});
  if(av.some(v=>v===null)||bv.some(v=>v===null))return null;
  return pearsonR(av,bv);
}

// Compute within-person H1: r(c_weight, ICC_with_baseline)
function computeH1r(sessions){
  if(sessions.length<3)return null;
  const baseline=sessions[0];
  const cs=[], iccs=[];
  for(let i=1;i<sessions.length;i++){
    const icc=computeICC(baseline,sessions[i]);
    if(icc!==null){cs.push(sessions[i].metrics.c);iccs.push(icc);}
  }
  if(cs.length<2)return null;
  return pearsonR(cs,iccs);
}

// ── COHERENCE COMPUTATION ──────────────────────────────────────────
function computeCoherence(session){
  const {attention,emotion,responses}=session;
  const anchorScore=(attention+emotion)/10;

  // ── c_weight PREDICTOR components (independent of ICC criterion) ──
  // These three are the PREDICTORS. ICC cross-session is the CRITERION.
  // No component of c_weight shares variance with ICC_cross_session by construction.
  // Pre-registered formula: OSF https://doi.org/10.17605/OSF.IO/W7NYH

  // Component 1: State anchor (self-report) — 35%
  // Mechanistically independent of rating variance or cross-session consistency.

  // Component 2: Response time regularity — 35%
  // RT variance is not rating variance. A calm annotator has consistent pacing;
  // a drift-state annotator has erratic RT (rushed then lingered).
  const rts=responses.map(r=>r.rt).filter(rt=>rt>400&&rt<28000);
  const rtCV=rts.length>1?stdDev(rts)/Math.max(1,mean(rts)):0.5;
  const rtScore=clamp(1-rtCV/2,0,1);

  // Component 3: Gold accuracy — 30%
  // Whether a person knows the correct answer to factual items has no
  // mathematical relationship to whether their value judgments are consistent.
  const golds=responses.filter(r=>r.is_gold);
  let goldScore=0.5;
  if(golds.length){
    const correct=golds.filter(g=>{
      if(g.format==='pairwise')return g.value===g.gold_correct;
      if(g.gold==='high')return g.value>=4;
      if(g.gold==='low')return g.value<=2;
      return false;
    }).length;
    goldScore=correct/golds.length;
  }

  // ── INDEPENDENT VALIDATION metric (NOT part of c_weight) ──
  // iccProxy = within-session rating consistency.
  // This is a SEPARATE construct, reported alongside c_weight.
  // H1 tests whether c_weight (anchor+RT+gold) predicts ICC_cross_session.
  // H1a (bonus): does c_weight also predict iccProxy within-session?
  const ratings=responses.filter(r=>r.type==='rating'&&r.value!=null).map(r=>r.value);
  const iccProxy=ratings.length>1?clamp(1-stdDev(ratings)/4,0,1):0.5;

  // Layer-specific consistency scores (for Layer × Drift H5 analysis)
  const layerScores={};
  ['L1','L2','L3','L4'].forEach(l=>{
    const lr=responses.filter(r=>r.layer===l&&r.type==='value'&&r.value!=null).map(r=>r.value);
    layerScores[l]=lr.length>1?clamp(1-stdDev(lr)/4,0,1):null;
  });

  // c_weight: anchor (35%) + RT regularity (35%) + gold accuracy (30%)
  // iccProxy is NOT in this formula — it is the within-session validation metric
  const c=clamp(.35*anchorScore+.35*rtScore+.30*goldScore,.05,.97);
  return{
    c:fmt3(c),w:fmt3(getW(c)),
    anchorScore:fmt3(anchorScore),rtScore:fmt3(rtScore),goldScore:fmt3(goldScore),
    iccProxy:fmt3(iccProxy), // reported separately, not used in c
    confidence:fmt3(clamp(.4+.05*(session.sessionN||1),0,1)),
    layerScores
  };
}

// ── MERKLE ─────────────────────────────────────────────────────────
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function buildMerkle(sessions){
  if(!sessions.length)return{root:'0'.repeat(64),leaves:[]};
  const leaves=await Promise.all(sessions.map(s=>sha256(JSON.stringify({id:s.id,ts:s.ts,c:s.metrics?.c||0}))));
  let level=[...leaves];
  while(level.length>1){const next=[];for(let i=0;i<level.length;i+=2)next.push(await sha256(level[i]+(level[i+1]||level[i])));level=next}
  return{root:level[0],leaves};
}

  STATES.forEach((s,si)=>{
    h+=`<div style="display:flex;align-items:center;gap:3px;margin-bottom:3px"><div style="width:124px;flex-shrink:0;text-align:right;padding-right:6px"><div style="font-size:10px;color:var(--i2)">${s.icon} ${s.label.substring(0,14)}</div><div style="font-size:9px;color:${s.tier==='hi'?'var(--t)':s.tier==='med'?'var(--a)':s.tier==='drift'?'var(--r)':'#7B1A1A'}">${s.tier==='hi'?'High':s.tier==='med'?'Medium':s.tier==='drift'?'Drift':'Severe'}</div></div>`;

function buildSimMets(){

  el.innerHTML=[['Mean coherence',avg(allC).toFixed(2),'var(--t)'],

function expNext(){
  const rt=Math.round(performance.now()-EXP._taskStart);
  const q=EXP.items[EXP.idx];
  const resp={qid:q.id,layer:q.l,type:q.type,format:q.format,rt,is_gold:q.type==='gold'};
  if(q.format==='rating'){resp.value=EXP.sel;if(q.type==='gold'){resp.gold=q.gold}}
  else{resp.value=EXP.sel;if(q.type==='gold')resp.gold_correct=q.gold==='high'?'A':'B'}
  EXP.session.responses.push(resp);
  EXP.sel=null;
  if(++EXP.idx>=EXP.items.length) renderStep(4);
  else expQuestions(document.getElementById('exp-content'));
}

async function expCompute(el){
  el.innerHTML=`<div class="card" style="text-align:center;padding:34px">
    <div style="font-size:40px;margin-bottom:14px">⚙️</div>
    <div style="font-family:var(--fh);font-size:18px;font-weight:700;margin-bottom:14px">Computing coherence score</div>
    <div style="background:var(--sf2);border-radius:8px;padding:13px;font-family:var(--fm);font-size:11px;line-height:1.8;text-align:left;margin-bottom:14px;color:var(--i2)" id="clog">Initialising...</div>
    <div style="height:4px;background:var(--br);border-radius:2px;overflow:hidden"><div id="cbar" style="height:4px;background:var(--t);width:0%;transition:width .3s;border-radius:2px"></div></div>
  </div>`;
  const log=d=>document.getElementById('clog').textContent=d;
  const bar=p=>document.getElementById('cbar').style.width=p+'%';
  const att=EXP.session.attention,emo=EXP.session.emotion;
  const steps=[[12,`anchor_score = (${att}+${emo})/10 = ${((att+emo)/10).toFixed(2)}`],[26,`response time regularity (RT_score) computed across ${EXP.session.responses.length} tasks`],[42,`gold accuracy — ${EXP.session.responses.filter(r=>r.is_gold).length} factual accuracy items evaluated`],[58,`c = 0.35×anchor + 0.35×RT + 0.30×gold  [pre-registered OSF.IO/W7NYH]`],[72,`icc_proxy computed separately as independent validation metric`],[82,`Layer × coherence analysis (L1-L4) computed`],[92,`SHA-256 Merkle leaf generated via Web Crypto API`],[100,`ICC with previous sessions computed. Stored in IndexedDB.`]];
  for(const [p,m]of steps){await new Promise(r=>setTimeout(r,300+Math.random()*160));log(m);bar(p)}

  const sessions=await getSessions();
  EXP.session.sessionN=sessions.length+1;
  EXP.session.metrics=computeCoherence(EXP.session);
  const prev=sessions.length?sessions[sessions.length-1]:null;
  EXP.session.prevC=prev?.metrics?.c??null;
  EXP.session.deltaC=prev?fmt3(EXP.session.metrics.c-prev.metrics.c):null;

  // Compute ICC with each previous session
  EXP.session.iccHistory=sessions.map((s,i)=>({sessionN:i+1,icc:computeICC(s,EXP.session),c_prev:s.metrics?.c})).filter(x=>x.icc!==null);

  // Within-person H1: r(c, ICC) across all sessions
  const allSess=[...sessions,EXP.session];
  EXP.session.h1r=computeH1r(allSess);

  // Merkle
  const mkl=await buildMerkle(allSess);
  EXP.session.merkleRoot=mkl.root;EXP.session.merkleLeaves=mkl.leaves;

  await dbPut('sessions',{id:EXP.session.id,ts:EXP.session.ts,
    anchor:{attention:EXP.session.attention,emotion:EXP.session.emotion},
    responses:EXP.session.responses,metrics:EXP.session.metrics,
    deltaC:EXP.session.deltaC,sessionN:EXP.session.sessionN,
    merkleRoot:EXP.session.merkleRoot,iccHistory:EXP.session.iccHistory,h1r:EXP.session.h1r});
  renderStep(5);
}

  <div class="g3">
    <div class="card-s"><div style="font-size:12px;font-weight:600;margin-bottom:5px">Signal packets</div><p style="font-size:11px;color:var(--i2);margin-bottom:8px">c_weight, Δc, ICC, h1_r, Merkle root. Nothing personal.</p><button class="btn bs bsm" style="width:100%" onclick="exportPkts()">↓ Export packets</button></div>
    <div class="card-s"><div style="font-size:12px;font-weight:600;margin-bottom:5px">Full local data</div><p style="font-size:11px;color:var(--i2);margin-bottom:8px">All sessions with raw responses. Local reference.</p><button class="btn bg bsm" style="width:100%" onclick="exportFull()">↓ Export JSON</button></div>
    <div class="card-s"><div style="font-size:12px;font-weight:600;margin-bottom:5px">H1 contribution</div><p style="font-size:11px;color:var(--i2);margin-bottom:8px">Mock send to H1 pool. Only packets, no raw data.</p><button class="btn bp bsm" style="width:100%" onclick="mockH1()">🔬 Contribute</button></div>
  </div>`;
}

async function exportPkts(){
  const sessions=await getSessions();
  const pkts=sessions.map((s,i)=>({schema:'cwhf/1.0',c_weight:s.metrics?.c,delta_c:s.deltaC,icc_anchor:s.iccHistory?.[s.iccHistory.length-1]?.icc??null,h1_r:s.h1r??null,confidence:s.metrics?.confidence,session_n:s.sessionN,gold_accuracy:s.metrics?.goldScore,merkle_root:s.merkleRoot,timestamp:new Date(s.ts).toISOString(),raw_data:null}));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({schema:'cwhf/1.0',packets:pkts},null,2)],{type:'application/json'}));a.download=`cwhf_packets_${Date.now()}.json`;a.click();notify('Signal packets exported.')
}
async function exportFull(){const sessions=await getSessions();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({warning:'FULL LOCAL DATA — contains raw responses.',sessions},null,2)],{type:'application/json'}));a.download=`cwhf_full_${Date.now()}.json`;a.click()}
async function mockH1(){const sessions=await getSessions();if(!sessions.length){notify('Run at least one live session first.');return}const mkl=await buildMerkle(sessions);notify(`✅ Mock H1: ${sessions.length} packet(s) · r=${EXP.session?.h1r?.toFixed(3)||'—'} · Merkle ${mkl.root.slice(0,10)}… · No raw data sent.`,5000)}

// ── BOOT ────────────────────────────────────────────────────────────
async function boot(){try{await initDB()}catch(e){console.warn('IndexedDB:',e)}renderThesis()}
boot();
</script>
