<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CWHF Coherence Lab — Signal ≠ Value</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   DESIGN TOKENS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
:root {
  --bg: #F9F8F6;
  --surface: #FFFFFF;
  --surface-2: #F4F3F0;
  --border: rgba(15,15,10,0.08);
  --border-strong: rgba(15,15,10,0.16);

  --ink: #0F0F0D;
  --ink-2: #4A4A47;
  --ink-3: #8A8A87;
  --ink-4: #B8B8B5;

  --teal: #0B6E58;
  --teal-mid: #1A8F72;
  --teal-light: #E8F5F1;
  --teal-xlight: #F2FAF7;

  --amber: #A85A0A;
  --amber-light: #FEF3E7;
  --red: #B83232;
  --red-light: #FEF0F0;
  --blue: #1A5FA8;
  --blue-light: #EEF4FE;
  --purple: #6B4EC6;
  --purple-light: #F1EEFE;

  --nav-h: 60px;
  --max-w: 1080px;
  --gap: 20px;

  --f-head: 'Sora', sans-serif;
  --f-body: 'Plus Jakarta Sans', sans-serif;
  --f-mono: 'JetBrains Mono', monospace;

  --ease: cubic-bezier(.4,0,.2,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   RESET & BASE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { font-size:14px; -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body {
  font-family: var(--f-body);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
img,svg,canvas { display:block; max-width:100%; }
button { font-family: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
::selection { background: var(--teal-light); }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TYPOGRAPHY
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.t-display { font-family:var(--f-head); font-size:clamp(32px,5vw,56px); font-weight:700; line-height:1.1; letter-spacing:-0.02em; }
.t-h1 { font-family:var(--f-head); font-size:clamp(22px,3vw,32px); font-weight:700; line-height:1.2; letter-spacing:-0.01em; }
.t-h2 { font-family:var(--f-head); font-size:clamp(16px,2vw,20px); font-weight:600; line-height:1.3; }
.t-h3 { font-family:var(--f-head); font-size:15px; font-weight:600; line-height:1.4; }
.t-body { font-size:14px; line-height:1.75; color: var(--ink-2); }
.t-small { font-size:12px; line-height:1.6; color: var(--ink-3); }
.t-label { font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-3); }
.t-mono { font-family:var(--f-mono); font-size:12px; }
.t-teal { color: var(--teal); }
.t-amber { color: var(--amber); }
.t-red { color: var(--red); }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   NAVIGATION
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.nav {
  position: fixed; top:0; left:0; right:0; z-index:1000;
  height: var(--nav-h);
  background: rgba(249,248,246,0.92);
  backdrop-filter: blur(16px) saturate(1.4);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 24px; gap: 0;
}
.nav-brand {
  font-family: var(--f-head);
  font-size: 15px; font-weight: 700;
  letter-spacing: -0.02em;
  margin-right: 32px; flex-shrink:0;
}
.nav-brand em { color: var(--teal); font-style:normal; }
.nav-links { display:flex; gap:4px; flex:1; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.nav-links::-webkit-scrollbar { display:none; }
.nav-btn {
  padding: 7px 14px; border-radius: 8px; border: none;
  background: transparent; color: var(--ink-3);
  font-size: 13px; font-weight: 500; font-family:var(--f-body);
  white-space: nowrap; transition: all .15s var(--ease);
}
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn.on { background: var(--teal-light); color: var(--teal); font-weight:600; }
.nav-right { display:flex; align-items:center; gap:8px; margin-left:auto; flex-shrink:0; }

/* Mode pills */
.mode-pill {
  display: flex; border-radius: 8px; overflow:hidden;
  border: 1px solid var(--border); background: var(--surface-2);
}
.mode-pill button {
  padding: 5px 13px; border: none; background: transparent;
  font-size: 11px; font-weight:700; color: var(--ink-3);
  font-family:var(--f-mono); letter-spacing:.03em; transition: all .15s;
}
.mode-pill button.on { background: var(--teal); color: white; }
.mode-pill button.mock-on { background: var(--ink-2); color: white; }

/* Lang select */
.lang-sel {
  padding: 5px 8px; border: 1px solid var(--border); border-radius:7px;
  background: var(--surface); font-size:12px; color: var(--ink-3);
  font-family:var(--f-body); cursor:pointer; outline:none;
}

/* Mode badges */
.badge-mock {
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 10px; border-radius:5px; font-size:10px; font-weight:700;
  font-family:var(--f-mono); letter-spacing:.04em; text-transform:uppercase;
  background:#E8E7E4; color:var(--ink-2);
}
.badge-live {
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 10px; border-radius:5px; font-size:10px; font-weight:700;
  font-family:var(--f-mono); letter-spacing:.04em; text-transform:uppercase;
  background:var(--teal-light); color:var(--teal);
}
.badge-live::before {
  content:''; width:6px; height:6px; border-radius:50%; background:var(--teal);
  animation: blink 2s ease infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   LAYOUT
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.main { margin-top: var(--nav-h); }
.page { display:none; }
.page.on { display:block; }
.wrap { max-width:var(--max-w); margin:0 auto; padding:0 24px 100px; }
.wrap-sm { max-width:680px; margin:0 auto; padding:0 24px 100px; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:var(--gap); }
.grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--gap); }
.grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:var(--gap); }

/* Section headers */
.section { padding: 48px 0 0; }
.section-label {
  font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color: var(--teal); margin-bottom:10px; display:flex; align-items:center; gap:8px;
}
.section-label::before { content:''; width:20px; height:1px; background:var(--teal); }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   CARDS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px 22px;
}
.card-sm {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 9px; padding: 14px 16px;
}
.card-teal { background: var(--teal-xlight); border-color: rgba(11,110,88,.12); }
.card-amber { background: var(--amber-light); border-color: rgba(168,90,10,.12); }
.card-red { background: var(--red-light); border-color: rgba(184,50,50,.12); }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   METRIC CELLS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.metric-cell { padding:16px 18px; background:var(--surface-2); border-radius:10px; }
.metric-num {
  font-family:var(--f-mono); font-size:28px; font-weight:500;
  letter-spacing:-0.03em; line-height:1; margin-bottom:4px;
}
.metric-label { font-size:11px; color:var(--ink-3); line-height:1.4; }
.mini-bar { height:3px; background:var(--border); border-radius:2px; margin-top:8px; }
.mini-bar-fill { height:3px; border-radius:2px; transition: width .6s var(--ease); }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   BUTTONS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.btn {
  display:inline-flex; align-items:center; gap:7px;
  padding:11px 22px; border-radius:9px; border:none;
  font-size:13px; font-weight:600; font-family:var(--f-body);
  cursor:pointer; transition:all .15s var(--ease); white-space:nowrap;
}
.btn-primary { background:var(--teal); color:#fff; }
.btn-primary:hover { background:var(--teal-mid); transform:translateY(-1px); box-shadow:0 4px 12px rgba(11,110,88,.3); }
.btn-secondary { background:var(--teal-light); color:var(--teal); border:1px solid rgba(11,110,88,.2); }
.btn-secondary:hover { background:var(--teal); color:#fff; }
.btn-ghost { background:transparent; color:var(--ink-2); border:1px solid var(--border); }
.btn-ghost:hover { background:var(--surface-2); }
.btn-sm { padding:8px 16px; font-size:12px; border-radius:7px; }
.btn:disabled { opacity:.45; cursor:default; transform:none!important; box-shadow:none!important; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TAB BAR (sub-navigation within pages)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.tabbar {
  position: sticky; top: var(--nav-h); z-index:90;
  background: rgba(249,248,246,0.95); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
}
.tabbar-inner { max-width:var(--max-w); margin:0 auto; display:flex; gap:0; overflow-x:auto; scrollbar-width:none; }
.tabbar-inner::-webkit-scrollbar { display:none; }
.tab-btn {
  padding: 13px 18px; border:none; border-bottom:2px solid transparent;
  background:transparent; color:var(--ink-3);
  font-size:13px; font-weight:500; font-family:var(--f-body);
  cursor:pointer; white-space:nowrap; transition:all .15s;
}
.tab-btn:hover { color:var(--ink); }
.tab-btn.on { color:var(--teal); border-bottom-color:var(--teal); font-weight:600; }
.tab-panel { display:none; }
.tab-panel.on { display:block; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TABLES
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.data-table { width:100%; border-collapse:collapse; font-size:12px; }
.data-table th {
  text-align:left; padding:9px 12px; background:var(--surface-2);
  font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-3); border-bottom:1px solid var(--border);
}
.data-table td { padding:9px 12px; border-bottom:1px solid var(--border); color:var(--ink-2); vertical-align:top; }
.data-table tr:last-child td { border-bottom:none; }
.data-table tr:hover td { background:var(--teal-xlight); }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   CODE BLOCK
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.code-block {
  font-family:var(--f-mono); font-size:12px; line-height:1.8;
  background:#0D1117; color:#C9D1D9; border-radius:10px;
  padding:18px 20px; overflow-x:auto; white-space:pre;
}
.code-block .k { color:#7EE787; } /* key */
.code-block .v { color:#FFA657; } /* value */
.code-block .s { color:#79C0FF; } /* string */
.code-block .c { color:#6E7681; } /* comment */

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   HEATMAP
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.heatmap-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.heatmap-cell {
  width:42px; height:34px; border-radius:5px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--f-mono); font-size:10px; font-weight:500; color:rgba(255,255,255,.95);
  border:1.5px solid transparent; flex-shrink:0;
  transition:transform .12s var(--ease-spring), box-shadow .12s;
}
.heatmap-cell:hover { transform:scale(1.25); box-shadow:0 4px 12px rgba(0,0,0,.2); z-index:5; position:relative; }
.heatmap-cell.sel { border-color:rgba(0,0,0,.5)!important; transform:scale(1.15); }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   EXPERIMENT WIZARD
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.wizard-step { display:none; }
.wizard-step.on { display:block; }

.step-dots { display:flex; gap:6px; align-items:center; justify-content:center; margin-bottom:28px; flex-wrap:wrap; }
.step-dot {
  width:26px; height:26px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--f-mono); font-size:10px; font-weight:500;
  border:1.5px solid var(--border); background:var(--bg);
  color:var(--ink-3); transition:all .25s var(--ease);
}
.step-dot.done { background:var(--teal); border-color:var(--teal); color:white; }
.step-dot.curr { background:var(--surface); border-color:var(--teal); color:var(--teal); }
.step-line { width:20px; height:1.5px; background:var(--border); border-radius:1px; transition:background .25s; }
.step-line.done { background:var(--teal); }

.slider-group { margin-bottom:22px; }
.slider-group-label { font-size:13px; font-weight:600; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
.slider-group-label span { font-family:var(--f-mono); font-size:20px; color:var(--teal); font-weight:500; }
.slider-row { display:flex; align-items:center; gap:10px; }
.slider-row .end-label { font-size:11px; color:var(--ink-3); min-width:60px; }

// ─── INDEXEDDB ─────────────────────────────────────────────────
async function initDB() {
  return new Promise((res,rej) => {
    const req = indexedDB.open(DB, 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('sessions')) {
        d.createObjectStore('sessions',{keyPath:'id'}).createIndex('ts','ts');
      }
      if(!d.objectStoreNames.contains('user')) d.createObjectStore('user',{keyPath:'key'});
    };
    req.onsuccess = e => { db=e.target.result; res(db); };
    req.onerror = () => rej(req.error);
  });
}
async function dbPut(store,data) {
  return new Promise((res,rej) => {
    const tx=db.transaction(store,'readwrite');
    tx.objectStore(store).put(data).onsuccess=()=>res();
    tx.onerror=()=>rej(tx.error);
  });
}
async function dbGet(store,key) {
  return new Promise((res,rej) => {
    const tx=db.transaction(store,'readonly');
    const r=tx.objectStore(store).get(key);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function dbGetAll(store) {
  return new Promise((res,rej) => {
    const tx=db.transaction(store,'readonly');
    const r=tx.objectStore(store).getAll();
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function getSessions() { try { return await dbGetAll('sessions'); } catch(e) { return []; } }

// ─── MERKLE + CRYPTO ───────────────────────────────────────────
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function buildMerkle(sessions) {
  if(!sessions.length) return {root:'0'.repeat(64),leaves:[]};
  const leaves = await Promise.all(sessions.map(s=>sha256(JSON.stringify({id:s.id,ts:s.ts,c:s.metrics?.c||0}))));
  let level=[...leaves];
  while(level.length>1) {
    const next=[];
    for(let i=0;i<level.length;i+=2) next.push(await sha256(level[i]+(level[i+1]||level[i])));
    level=next;
  }
  return {root:level[0],leaves};
}

// ─── COHERENCE COMPUTATION ─────────────────────────────────────
function computeCoherence(session) {
  const {attention,emotion,responses} = session;
  const anchorScore = (attention+emotion)/10;
  const ratings = responses.filter(r=>r.type==='rating').map(r=>r.value).filter(Boolean);
  const iccProxy = ratings.length>1 ? clamp(1-stdDev(ratings)/4,0,1) : 0.5;
  const rts = responses.map(r=>r.rt).filter(rt=>rt>400&&rt<25000);
  const rtCV = rts.length>1 ? stdDev(rts)/Math.max(1,rts.reduce((a,b)=>a+b)/rts.length) : 0.5;
  const rtScore = clamp(1-rtCV/2,0,1);
  const golds = responses.filter(r=>r.is_gold);
  let goldScore = 0.5;
  if(golds.length) {
    const correct = golds.filter(g => {
      if(g.type==='pairwise') return g.value===g.gold_correct;
      if(g.gold==='high') return g.value>=4;
      if(g.gold==='low') return g.value<=2;
      return false;
    }).length;
    goldScore = correct/golds.length;
  }
  const c = clamp(.30*anchorScore + .30*iccProxy + .25*rtScore + .15*goldScore, .05, .97);
  return { c:fmt3(c), w:fmt3(getW(c)), anchorScore:fmt3(anchorScore), iccProxy:fmt3(iccProxy), rtScore:fmt3(rtScore), goldScore:fmt3(goldScore), confidence:fmt3(clamp(.4+.05*(session.sessionN||1),0,1)) };
}

  let h=`<div style="display:flex;gap:3px;margin-bottom:3px;padding-left:136px">${ph}</div>`;
  STATES.forEach((s,si)=>{
    h+=`<div style="display:flex;align-items:center;gap:3px;margin-bottom:3px">
      <div style="width:130px;flex-shrink:0;text-align:right;padding-right:6px">
        <div style="font-size:11px;color:var(--ink-2)">${s.icon} ${s.label.substring(0,14)}</div>
        <div style="font-size:9px;color:${TC[s.tier]}">${tierLabel(s.base)}</div>
      </div>`;
    PERSONAS.forEach((_,pi)=>{
      const c=getC(pi,si), w=getW(c);
      const disp=simCW?w.toFixed(2):c.toFixed(2);
      const col=tc(c);
      const isSel=simSelCell===`${pi},${si}`;
      h+=`<div class="heatmap-cell${isSel?' sel':''}" style="background:${col};opacity:${.25+c*.75}" onclick="simSelectCell(${pi},${si})" title="${PERSONAS[pi].name} × ${s.label}: c=${c}">${disp}</div>`;
    });
    h+=`</div>`;
  });
  el.innerHTML=h;
}

function selRating(n) {
  _sel=n;
  document.querySelectorAll('.rating-btn').forEach((b,i)=>b.classList.toggle('sel',i+1===n));
  document.getElementById('next-btn').disabled=false;
}
function selPair(opt) {
  _sel=opt;
  ['A','B'].forEach(x=>document.getElementById(`pair${x}`)?.classList.toggle('sel',x===opt));
  document.getElementById('next-btn').disabled=false;
}

function nextTask() {
  const rt=Math.round(performance.now()-expSession.taskStart);
  const task=TASKS[expSession.currentTask];
  const resp={taskId:task.id,type:task.type,rt,is_gold:task.is_gold||false};
  if(task.type==='rating'){resp.value=_sel;if(task.is_gold){resp.gold=task.gold;}}
  else{resp.value=_sel;if(task.is_gold)resp.gold_correct=task.gold_correct;}
  expSession.responses.push(resp);
  _sel=null;
  if(++expSession.currentTask>=TASKS.length) renderExpStep(4);
  else expTasks(document.getElementById('exp-content'));
}

async function expCompute(el) {
  el.innerHTML=`
  <div class="card" style="text-align:center;padding:36px">
    <div style="font-size:40px;margin-bottom:14px">⚙️</div>
    <div class="t-h2" style="margin-bottom:16px">Computing coherence score</div>
    <div style="background:var(--surface-2);border-radius:8px;padding:14px;font-family:var(--f-mono);font-size:11px;line-height:1.8;text-align:left;margin-bottom:16px;color:var(--ink-2)" id="compute-log">Initialising...</div>
    <div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden"><div id="compute-bar" style="height:4px;background:var(--teal);width:0%;transition:width .3s;border-radius:2px"></div></div>
  </div>`;
  const log=document.getElementById('compute-log');
  const bar=document.getElementById('compute-bar');
  const att=expSession.attention, emo=expSession.emotion;
  const anch=((att+emo)/10).toFixed(2);
  const ratings=expSession.responses.filter(r=>r.type==='rating').map(r=>r.value).filter(Boolean);
  const icc=clamp(1-stdDev(ratings)/4,0,1).toFixed(2);
  const steps=[
    [12,`anchor_score = (${att} + ${emo}) / 10 = ${anch}`],
    [28,`rating std = ${stdDev(ratings).toFixed(3)}  →  icc_proxy = ${icc}`],
    [44,`rt variance computed across ${expSession.responses.length} tasks`],
    [60,`gold task accuracy evaluated...`],
    [76,`c = 0.30×${anch} + 0.30×${icc} + 0.25×rt + 0.15×gold`],
    [88,`SHA-256 Merkle leaf generated via Web Crypto API`],
    [100,`Session stored in IndexedDB. Complete.`],
  ];
  for(const [p,msg] of steps) {
    await new Promise(r=>setTimeout(r,320+Math.random()*180));
    if(log)log.textContent=msg;
    if(bar)bar.style.width=p+'%';
  }
  const sessions=await getSessions();
  expSession.sessionN=sessions.length+1;
  expSession.metrics=computeCoherence(expSession);
  const prev=sessions.length?sessions[sessions.length-1]:null;
  expSession.prevC=prev?.metrics?.c??null;
  expSession.deltaC=prev?fmt3(expSession.metrics.c-prev.metrics.c):null;
  const allSess=[...sessions,expSession];
  const mkl=await buildMerkle(allSess);
  expSession.merkleRoot=mkl.root; expSession.merkleLeaves=mkl.leaves;
  await dbPut('sessions',{id:expSession.id,ts:expSession.ts,anchor:{attention:expSession.attention,emotion:expSession.emotion},responses:expSession.responses,metrics:expSession.metrics,deltaC:expSession.deltaC,sessionN:expSession.sessionN,merkleRoot:expSession.merkleRoot});
  renderExpStep(5);
}

  const sessions=await getSessions();

function fmtPacket(p) {
  return JSON.stringify(p,null,2)
    .replace(/"(\w+)":/g,'<span style="color:#7EE787">"$1":</span>')
    .replace(/: "(.*?)"/g,': <span style="color:#FFA657">"$1"</span>')
    .replace(/: ([\d.e+-]+)/g,': <span style="color:#79C0FF">$1</span>')
    .replace(/: null/g,': <span style="color:#7EE787">null</span>');
}

async function dlPacket() {
  if(!window._expPacket)return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(window._expPacket,null,2)],{type:'application/json'}));
  a.download=`cwhf_signal_${Date.now()}.json`; a.click();
  notify('Signal packet downloaded. Raw data stayed on device.');
}

async function mockSend() {
  const el=document.getElementById('send-result');
  if(!el)return;
  el.innerHTML=`<div class="card card-teal" style="margin-top:10px;font-size:12px"><div id="send-log">Packaging delta packet…</div></div>`;
  const steps=['Packaging delta packet…','Attaching Merkle root…','Simulating encrypted channel (mock)…','Routing to CWHF interop endpoint (mock)…','Acknowledgement received.'];
  for(const s of steps){ await new Promise(r=>setTimeout(r,420)); document.getElementById('send-log').textContent=s; }
  el.innerHTML=`<div class="card card-teal" style="margin-top:10px;font-size:12px;line-height:1.8">
    ✅ Mock send complete.<br>
    → c_weight <strong>${window._expPacket?.c_weight?.toFixed(2)}</strong> + Merkle root packaged<br>
    → Raw annotations remained on your device<br>
    → In production: packet routes to CWHF interop endpoint<br>
    → AI lab receives only the weight — no annotations, no identity
  </div>`;
}

async function clearAllData() {
  if(!confirm('Clear all session data from this device? This cannot be undone.'))return;
  const r=indexedDB.deleteDatabase(DB);
  r.onsuccess=()=>{db=null;initDB().then(()=>{notify('All local data cleared.');renderExpStep(0);});};
}

    return;
  }
  el.innerHTML=`<table class="data-table">
    <thead><tr><th>#</th><th>c_weight</th><th>Δc</th><th>Gold</th><th>ICC</th><th>Date</th></tr></thead>
    <tbody>${sessions.map((s,i)=>`<tr>
      <td style="font-family:var(--f-mono);color:var(--ink-3)">S${i+1}</td>
      <td style="font-family:var(--f-mono);font-weight:600;color:${tc(s.metrics?.c||0)}">${(s.metrics?.c||0).toFixed(2)}</td>
      <td style="font-family:var(--f-mono);font-weight:500;color:${s.deltaC>0?'var(--teal)':s.deltaC<0?'var(--red)':'var(--ink-3)'}">${s.deltaC!==null?(s.deltaC>=0?'+':'')+s.deltaC.toFixed(2):'—'}</td>
      <td style="font-family:var(--f-mono)">${(s.metrics?.goldScore||0).toFixed(2)}</td>
      <td style="font-family:var(--f-mono)">${(s.metrics?.iccProxy||0).toFixed(2)}</td>
      <td class="t-small">${new Date(s.ts).toLocaleDateString()}</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

async function loadMyData() {
  const el=document.getElementById('my-data-content');
  if(!el)return;
  const sessions=await getSessions();
  if(!sessions.length){
    el.innerHTML=`<div class="card" style="text-align:center;padding:32px;color:var(--ink-3)">
      <p style="margin-bottom:12px">You have not run any live sessions yet.</p>
      <button class="btn btn-primary btn-sm" onclick="nav(2)">Run the live experiment →</button>
    </div>`;
    return;
  }
  const avgC=(sessions.reduce((a,s)=>a+(s.metrics?.c||0),0)/sessions.length).toFixed(2);
  const trend=sessions.length>=2?sessions[sessions.length-1].metrics.c-sessions[0].metrics.c:null;
  el.innerHTML=`
  <div class="grid-4" style="margin-bottom:var(--gap)">
    <div class="metric-cell"><div class="metric-num" style="color:var(--teal)">${sessions.length}</div><div class="metric-label">Sessions completed</div></div>
    <div class="metric-cell"><div class="metric-num" style="color:${tc(+avgC)}">${avgC}</div><div class="metric-label">Mean c_weight</div></div>
    <div class="metric-cell"><div class="metric-num">${trend!==null?(trend>0?'↑ '+trend.toFixed(2):trend<0?'↓ '+Math.abs(trend).toFixed(2):'→'):'—'}</div><div class="metric-label">S1→Sn trend</div></div>
    <div class="metric-cell"><div class="metric-num">${sessions.length}</div><div class="metric-label">Merkle leaves</div></div>
  </div>
  <div class="card" style="margin-bottom:var(--gap)">
    <table class="data-table">
      <thead><tr><th>Session</th><th>Date</th><th>c_weight</th><th>Δc</th><th>CWHF weight</th><th>Merkle root</th></tr></thead>
      <tbody>${sessions.map((s,i)=>`<tr>
        <td style="font-family:var(--f-mono);color:var(--ink-3)">S${i+1}</td>
        <td class="t-small">${new Date(s.ts).toLocaleDateString()}</td>
        <td style="font-family:var(--f-mono);font-weight:700;color:${tc(s.metrics?.c||0)}">${(s.metrics?.c||0).toFixed(3)}</td>
        <td style="font-family:var(--f-mono);color:${s.deltaC>0?'var(--teal)':s.deltaC<0?'var(--red)':'var(--ink-3)'}">${s.deltaC!==null?(s.deltaC>=0?'+':'')+s.deltaC.toFixed(3):'—'}</td>
        <td style="font-family:var(--f-mono)">${(s.metrics?.w||0).toFixed(3)}</td>
        <td style="font-family:var(--f-mono);font-size:10px;color:var(--ink-3)">${s.merkleRoot?.slice(0,14)||'—'}…</td>
      </tr>`).join('')}
      </tbody>
    </table>
  </div>
  <div class="grid-3">
    <div class="card-sm"><div class="t-h3" style="margin-bottom:5px">Signal packets only</div><p class="t-body" style="font-size:11px;margin-bottom:10px">c_weight + Δc + Merkle root. Nothing personal.</p><button class="btn btn-secondary btn-sm" style="width:100%" onclick="exportPackets()">↓ Export packets</button></div>
    <div class="card-sm"><div class="t-h3" style="margin-bottom:5px">Full local data</div><p class="t-body" style="font-size:11px;margin-bottom:10px">All sessions with raw responses. Local reference only.</p><button class="btn btn-ghost btn-sm" style="width:100%" onclick="exportFull()">↓ Export full JSON</button></div>
    <div class="card-sm"><div class="t-h3" style="margin-bottom:5px">H1 contribution (mock)</div><p class="t-body" style="font-size:11px;margin-bottom:10px">Simulate sending packets to H1 research pool.</p><button class="btn btn-primary btn-sm" style="width:100%" onclick="mockH1()">🔬 Contribute to H1</button></div>
  </div>`;
}

async function exportPackets() {
  const sessions=await getSessions();
  const pkts=sessions.map((s,i)=>({schema:'cwhf/1.0',c_weight:s.metrics?.c,delta_c:s.deltaC,confidence:s.metrics?.confidence,session_n:s.sessionN,gold_accuracy:s.metrics?.goldScore,merkle_root:s.merkleRoot,timestamp:new Date(s.ts).toISOString(),raw_data:null}));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({schema:'cwhf/1.0',packets:pkts},null,2)],{type:'application/json'}));
  a.download=`cwhf_packets_${Date.now()}.json`; a.click();
  notify('Signal packets exported. Raw data stayed on your device.');
}

async function exportFull() {
  const sessions=await getSessions();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({warning:'FULL LOCAL DATA — contains raw responses. Do not share.',sessions},null,2)],{type:'application/json'}));
  a.download=`cwhf_full_${Date.now()}.json`; a.click();
}

async function mockH1() {
  const sessions=await getSessions();
  if(!sessions.length){notify('Run at least one live session first.');return;}
  const mkl=await buildMerkle(sessions);
  notify(`✅ Mock H1: ${sessions.length} packet(s) · Merkle root ${mkl.root.slice(0,12)}… · No raw data transmitted.`,5000);
}

// ─── BOOT ──────────────────────────────────────────────────────
async function boot() {
  try { await initDB(); } catch(e) { console.warn('IndexedDB unavailable:', e); }
  renderThesis();
}
boot();
</script>
</body>
