<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CWHF Coherence Lab — Signal ≠ Value</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
/* ── TOKENS ─────────────────────────────────────────────────────── */
:root{
  --t:#1D9E75;--tl:#E1F5EE;--td:#085041;
  --c:#D85A30;--cl:#FAECE7;--cd:#712B13;
  --a:#BA7517;--al:#FAEEDA;--ad:#633806;
  --b:#3B8BD4;--bl:#E6F1FB;--bd:#0C447C;
  --p:#7F77DD;--pl:#EEEDFE;--pd:#3C3489;
  --g:#888780;--gl:#F1EFE8;--gd:#444441;
  --tx:#1C1C1A;--t2:#5F5E5A;--t3:#888780;
  --bg:#F2F1EE;--card:#fff;--br:rgba(0,0,0,.08);
  --nav:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--tx);font-size:13px;line-height:1.6;overflow-x:hidden}

/* ── NAV ─────────────────────────────────────────────────────────── */
.nav{position:fixed;top:0;left:0;right:0;height:var(--nav);background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:.5px solid var(--br);z-index:1000;display:flex;align-items:center;padding:0 20px;gap:0}
.brand{font-size:14px;font-weight:700;letter-spacing:-.3px;text-decoration:none;color:var(--tx);margin-right:24px;flex-shrink:0}
.brand span{color:var(--t)}
.nav-tabs{display:flex;gap:2px;flex:1}
.nt{padding:6px 14px;border-radius:6px;border:none;background:transparent;color:var(--t2);cursor:pointer;font-size:12px;font-weight:500;transition:all .15s;white-space:nowrap}
.nt:hover{background:var(--gl);color:var(--tx)}
.nt.on{background:var(--tl);color:var(--td);font-weight:600}
.nav-right{display:flex;align-items:center;gap:8px;margin-left:auto}

/* ── MODE TOGGLE ─────────────────────────────────────────────────── */
.mode-toggle{display:flex;border-radius:8px;border:.5px solid var(--br);overflow:hidden;background:#f8f7f4}
.mt{padding:5px 14px;border:none;cursor:pointer;font-size:11px;font-weight:600;color:var(--t2);background:transparent;transition:all .15s}
.mt.on{color:white}
.mt.mock.on{background:var(--g)}
.mt.live.on{background:var(--t)}

/* ── MODE BADGES ─────────────────────────────────────────────────── */
.mock-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:4px;font-size:10px;font-weight:700;background:#E8E7E0;color:var(--gd);text-transform:uppercase;letter-spacing:.05em}
.live-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:4px;font-size:10px;font-weight:700;background:var(--tl);color:var(--td);text-transform:uppercase;letter-spacing:.05em}
.live-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--t);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── LANG SELECT ─────────────────────────────────────────────────── */
.lang-sel{padding:4px 8px;border:.5px solid var(--br);border-radius:5px;font-size:11px;background:var(--card);cursor:pointer;color:var(--t2)}

/* ── LAYOUT ──────────────────────────────────────────────────────── */
.main{margin-top:var(--nav);min-height:calc(100vh - var(--nav))}
.pg{display:none}.pg.on{display:block}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 80px}

/* ── TAB BAR ─────────────────────────────────────────────────────── */
.tbar{background:var(--card);border-bottom:.5px solid var(--br);position:sticky;top:var(--nav);z-index:90;padding:0 16px}
.tbar-inner{max-width:1080px;margin:0 auto;display:flex;gap:0}
.tb{padding:12px 16px;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--t2);cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap;transition:all .15s}
.tb:hover{color:var(--tx)}
.tb.on{color:var(--t);border-bottom-color:var(--t);font-weight:600}
.tc{display:none}.tc.on{display:block}

/* ── CARDS ───────────────────────────────────────────────────────── */
.card{background:var(--card);border:.5px solid var(--br);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.card-sm{background:var(--card);border:.5px solid var(--br);border-radius:7px;padding:10px 12px}
.lbl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.bx{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px}

/* ── GRIDS ───────────────────────────────────────────────────────── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:680px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ── METRICS ─────────────────────────────────────────────────────── */
.met{background:#f8f7f4;border-radius:7px;padding:10px 12px}
.mv{font-size:24px;font-weight:700;letter-spacing:-.5px}
.bar{height:4px;background:#E8E7E4;border-radius:2px;margin-top:4px}
.bf{height:4px;border-radius:2px;transition:width .6s cubic-bezier(.4,0,.2,1)}

/* ── PILLS ───────────────────────────────────────────────────────── */
.pl{padding:4px 10px;border-radius:16px;border:.5px solid var(--br);background:var(--card);color:var(--t2);cursor:pointer;font-size:11px;transition:all .12s}
.pl.on{border-color:var(--t);background:var(--tl);color:var(--td);font-weight:500}

/* ── TABLES ──────────────────────────────────────────────────────── */
.dt{width:100%;border-collapse:collapse;font-size:11px}
.dt th{background:#f8f7f4;padding:6px 8px;text-align:left;font-weight:600;color:var(--t3);border-bottom:.5px solid var(--br);font-size:10px;text-transform:uppercase}
.dt td{padding:6px 8px;border-bottom:.5px solid var(--br);color:var(--t2);vertical-align:top}
.dt tr:hover td{background:#fafaf8}

/* ── CALLOUT ─────────────────────────────────────────────────────── */
.callout{border-radius:0 7px 7px 0;padding:10px 14px;font-size:12px;line-height:1.65;border-left:3px solid;margin:8px 0}
.code{font-family:'Courier New',monospace;background:#f8f7f4;border-radius:6px;padding:10px 14px;font-size:11px;line-height:1.7;border-left:3px solid var(--t);white-space:pre-wrap;margin:6px 0}

/* ── HEATMAP CELLS ───────────────────────────────────────────────── */
.hc{width:44px;height:36px;border-radius:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;border:.5px solid transparent;transition:all .15s;flex-shrink:0;font-size:10px;font-weight:700;color:white;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.hc:hover{transform:scale(1.18);z-index:10;border-color:rgba(0,0,0,.3)!important}
.hc.sel{border-color:rgba(0,0,0,.5)!important;transform:scale(1.1);box-shadow:0 2px 8px rgba(0,0,0,.2)}

/* ── LIVE SESSION UI ─────────────────────────────────────────────── */
.session-step{display:none}.session-step.on{display:block}
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.slider-row label{font-weight:600;font-size:13px;min-width:120px}
.slider-row input[type=range]{flex:1;accent-color:var(--t);height:6px}
.slider-val{width:32px;text-align:center;font-weight:700;font-size:16px;color:var(--t)}
.task-card{border:.5px solid var(--br);border-radius:10px;padding:16px;margin-bottom:0;background:var(--card)}
.task-prompt{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.task-text{font-size:13px;color:var(--tx);line-height:1.7;margin-bottom:14px;padding:10px 14px;background:#f8f7f4;border-radius:6px;border-left:3px solid var(--br)}
.task-text.gold-hi{border-left-color:var(--t)}
.task-text.gold-lo{border-left-color:var(--c)}
.rating-btns{display:flex;gap:8px}
.rb{width:44px;height:44px;border-radius:8px;border:.5px solid var(--br);background:var(--card);cursor:pointer;font-size:14px;font-weight:600;color:var(--t2);transition:all .15s}
.rb:hover{border-color:var(--t);background:var(--tl);color:var(--td)}
.rb.sel{border-color:var(--t);background:var(--t);color:white}
.pair-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.pair-btn{padding:10px 14px;border-radius:8px;border:.5px solid var(--br);background:var(--card);cursor:pointer;font-size:12px;color:var(--t2);text-align:left;transition:all .15s;line-height:1.5}
.pair-btn:hover,.pair-btn.sel{border-color:var(--t);background:var(--tl);color:var(--td)}
.progress-bar{height:4px;background:#E8E7E4;border-radius:2px;margin-bottom:16px}
.progress-fill{height:4px;background:var(--t);border-radius:2px;transition:width .4s}
.task-nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.btn-prim{padding:10px 22px;border-radius:7px;border:none;background:var(--t);color:white;font-weight:600;font-size:13px;cursor:pointer;transition:all .15s}
.btn-prim:hover{background:var(--td)}
.btn-prim:disabled{background:#ccc;cursor:default}
.btn-sec{padding:9px 20px;border-radius:7px;border:.5px solid var(--t);background:var(--tl);color:var(--td);font-weight:600;font-size:13px;cursor:pointer;transition:all .15s}
.btn-sec:hover{background:var(--t);color:white}
.btn-ghost{padding:9px 20px;border-radius:7px;border:.5px solid var(--br);background:transparent;color:var(--t2);font-weight:500;font-size:13px;cursor:pointer}

/* ── HERO ─────────────────────────────────────────────────────────── */
.hero{padding:40px 20px;text-align:center;max-width:680px;margin:0 auto 8px}
.hero h1{font-size:36px;font-weight:700;letter-spacing:-.5px;margin-bottom:12px}
.hero h1 span{color:var(--t)}
.hero p{font-size:15px;color:var(--t2);line-height:1.7;margin-bottom:24px}

/* ── SCORE DISPLAY ───────────────────────────────────────────────── */
.score-ring{width:140px;height:140px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 16px;position:relative}
.score-ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg)}
.score-num{font-size:40px;font-weight:700;letter-spacing:-1px;color:var(--tx)}
.score-lbl{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase}
.delta-display{font-size:28px;font-weight:700;letter-spacing:-.5px}
.delta-pos{color:var(--t)}
.delta-neg{color:var(--c)}
.delta-neu{color:var(--g)}

/* ── MERKLE TREE VIZ ─────────────────────────────────────────────── */
.merkle-node{font-family:'Courier New',monospace;font-size:10px;padding:5px 10px;border-radius:4px;border:.5px solid var(--br);background:#f8f7f4;margin:2px;display:inline-block;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.merkle-root-node{background:var(--tl);border-color:var(--t);color:var(--td);font-weight:600}

/* ── PACKET VIZ ──────────────────────────────────────────────────── */
.packet{font-family:'Courier New',monospace;font-size:12px;background:#0D1117;color:#E6EDF3;border-radius:8px;padding:16px;line-height:1.8;position:relative}
.pk{color:#7EE787}.pv{color:#FFA657}.ps{color:#79C0FF}

/* ── STEP WIZARD ─────────────────────────────────────────────────── */
.step-indicator{display:flex;gap:6px;align-items:center;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.si{width:28px;height:28px;border-radius:50%;border:2px solid var(--br);background:var(--bg);color:var(--t3);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:all .3s}
.si.done{background:var(--t);border-color:var(--t);color:white}
.si.curr{background:var(--card);border-color:var(--t);color:var(--t)}
.si-line{width:20px;height:2px;background:var(--br);border-radius:1px}
.si-line.done{background:var(--t)}

/* ── FORMS ───────────────────────────────────────────────────────── */
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:11px;font-weight:600;color:var(--t3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 12px;border:.5px solid var(--br);border-radius:6px;font-size:13px;background:var(--card);color:var(--tx);outline:none}
.form-row input:focus,.form-row select:focus{border-color:var(--t)}

/* ── CONSENT ─────────────────────────────────────────────────────── */
.consent-item{display:flex;gap:10px;padding:10px 0;border-bottom:.5px solid var(--br)}
.consent-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.consent-text{font-size:12px;color:var(--t2);line-height:1.6}
.consent-text strong{color:var(--tx)}

/* ── HYPOTHESIS CARDS ────────────────────────────────────────────── */
.hyp-card{border-radius:9px;padding:12px 14px;margin-bottom:8px;border-left:4px solid}
.hyp-status{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}

/* ── NOTIFICATION ────────────────────────────────────────────────── */
.notif{position:fixed;bottom:24px;right:24px;background:var(--tx);color:white;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;max-width:300px}
.notif.on{transform:translateY(0);opacity:1}
</style>
</head>

<nav class="nav">

<script>
'use strict';

// ─── CONSTANTS ────────────────────────────────────────────────────
const DB_NAME = 'CWHF_Lab_v1';
const DB_VER = 1;
let db = null;
let currentPage = 0;
let currentMode = 'live';
let charts = {};

// ─── TASK BANK ────────────────────────────────────────────────────
// 8 tasks: 5 rating, 1 pairwise, 3 hidden gold items
const TASKS = [
  { id:'T1', type:'rating', is_gold:false, pair_id:'P1',
    prompt:"Rate this AI response for accuracy:",
    text:"Democratic participation requires informed citizens. Education systems should prioritize critical thinking and media literacy to strengthen democratic institutions." },
  { id:'T2', type:'rating', is_gold:true, gold_dir:'high', pair_id:'P2',
    prompt:"Rate this AI response for accuracy:",
    text:"Multiple randomised controlled trials confirm that mRNA COVID-19 vaccines reduce severe illness and hospitalisation by over 90% in initially healthy adults." },
  { id:'T3', type:'rating', is_gold:false, pair_id:'P1',
    prompt:"Rate this AI response for accuracy:",
    text:"Economic inequality, measured by the Gini coefficient, has increased in most OECD nations over the past three decades according to the OECD Income Distribution Database." },
  { id:'T4', type:'rating', is_gold:true, gold_dir:'low', pair_id:'P3',
    prompt:"Rate this AI response for accuracy:",
    text:"The French Revolution began in 1889 with the storming of the Bastille, which marked the decisive end of absolute monarchy in France." },
  { id:'T5', type:'rating', is_gold:false, pair_id:'P2',
    prompt:"Rate this AI response for accuracy:",
    text:"Machine learning models identify statistical patterns in training data; their performance on novel distributions depends on the distributional similarity between training and deployment contexts." },
  { id:'T6', type:'pairwise', is_gold:true, gold_correct:'A',
    prompt:"Which response is more factually accurate?",
    optionA:"Antibiotics work by killing or inhibiting bacteria. They have no effect on viral infections like the common cold or influenza.",
    optionB:"Antibiotics are effective against both bacterial and viral infections, making them suitable for treating colds, flu, and COVID-19." },
  { id:'T7', type:'rating', is_gold:true, gold_dir:'high', pair_id:'P3',
    prompt:"Rate this AI response for accuracy:",
    text:"Regular aerobic exercise of 150 minutes per week is associated with significant reductions in depression and anxiety symptoms across multiple meta-analyses of randomised trials." },
  { id:'T8', type:'rating', is_gold:false, pair_id:'P4',
    prompt:"Rate this AI response for accuracy:",
    text:"The IPCC Sixth Assessment Report (2021) concludes with high confidence that human activities are the primary driver of observed warming since the mid-20th century." }
];

// ─── SIMULATION DATA ──────────────────────────────────────────────
const PERSONAS = [
  {id:0,n:"Amara Osei",sh:"Amara",fl:"🇳🇬",role:"Gig annotator",c320:186,dc:.61,joh:"BLIND",
   L2:.52,L3:.61,L4:.58,L5:.62},
  {id:1,n:"Elena Kovač",sh:"Elena",fl:"🇧🇪",role:"Policy analyst",c320:261,dc:.09,joh:"OPEN",
   L2:.72,L3:.85,L4:.78,L5:.70},
  {id:2,n:"Ravi Kumar",sh:"Ravi",fl:"🇮🇳",role:"ML engineer",c320:238,dc:.14,joh:"OPEN",
   L2:.68,L3:.79,L4:.65,L5:.60},
  {id:3,n:"Sarah Njoroge",sh:"Sarah",fl:"🇰🇪",role:"Student/annotator",c320:194,dc:.51,joh:"BLIND",
   L2:.48,L3:.62,L4:.55,L5:.65},
  {id:4,n:"Yuki Tanaka",sh:"Yuki",fl:"🇯🇵",role:"UX researcher",c320:235,dc:.21,joh:"OPEN",
   L2:.70,L3:.76,L4:.72,L5:.65},
  {id:5,n:"Fatima Al-Rashid",sh:"Fatima",fl:"🇵🇰",role:"Community worker",c320:215,dc:.33,joh:"HIDDEN",
   L2:.58,L3:.64,L4:.60,L5:.72},
  {id:6,n:"Marcus Chen",sh:"Marcus",fl:"🇬🇧",role:"Data scientist",c320:221,dc:.28,joh:"OPEN",
   L2:.65,L3:.80,L4:.62,L5:.58},
  {id:7,n:"Priya Sharma",sh:"Priya",fl:"🇮🇳",role:"PhD student",c320:208,dc:.44,joh:"HIDDEN",
   L2:.55,L3:.71,L4:.56,L5:.68},
  {id:8,n:"David Santos",sh:"David",fl:"🇵🇭",role:"Freelance annotator",c320:181,dc:.62,joh:"BLIND",
   L2:.45,L3:.58,L4:.52,L5:.60},
  {id:9,n:"Aisha Mohammed",sh:"Aisha",fl:"🇪🇬",role:"Journalist",c320:229,dc:.18,joh:"OPEN",
   L2:.66,L3:.82,L4:.68,L5:.64}
];
const STATES = [
  {id:0,l:"Morning rested",em:"🌅",tier:"High",base:.82},
  {id:1,l:"Post-exercise",em:"🏃",tier:"High",base:.78},
  {id:2,l:"Weekend reflective",em:"☕",tier:"High",base:.86},
  {id:3,l:"Deep focus",em:"🎯",tier:"High",base:.80},
  {id:4,l:"Post-meal midday",em:"☀️",tier:"Medium",base:.70},
  {id:5,l:"Post-work fatigue",em:"😮‍💨",tier:"Medium",base:.52},
  {id:6,l:"Commute distracted",em:"🚇",tier:"Drift",base:.42},
  {id:7,l:"Deadline pressure",em:"⏰",tier:"Drift",base:.32},
  {id:8,l:"Emotional distress",em:"😔",tier:"Drift",base:.25},
  {id:9,l:"Late night 11pm+",em:"🌙",tier:"Severe",base:.18}
];
const MODS=[
  [0,-.04,-.02,-.03,-.04,-.02,+.02,+.01,+.02,+.03],
  [+.06,+.05,+.07,+.06,+.05,-.01,-.02,-.04,-.05,-.03],
  [+.04,+.04,+.03,+.06,+.04,-.02,-.03,-.05,-.06,-.04],
  [-.03,-.02,-.01,-.02,-.03,+.01,+.02,+.01,+.02,+.02],
  [+.02,+.02,+.03,+.04,+.03,-.01,-.02,-.02,-.03,-.02],
  [+.03,+.02,+.04,+.03,+.02,-.01,-.01,-.01,-.02,-.02],
  [+.02,+.03,+.03,+.04,+.03,-.01,-.02,-.03,-.04,-.03],
  [+.01,+.01,+.02,+.07,+.01,-.02,-.03,-.03,-.04,-.03],
  [-.05,-.04,-.03,-.02,-.04,+.02,+.03,+.03,+.04,+.04],
  [+.03,+.03,+.04,+.05,+.04,-.01,-.02,-.02,-.03,-.02]
];

function getC(pi,si){return Math.min(.97,Math.max(.10,parseFloat((STATES[si].base+MODS[pi][si]).toFixed(2))));}
function getW(c){return Math.min(1,Math.max(.1,.1+.9*Math.pow(c,1.5)));}
function cc(c){return c>=.72?"#1D9E75":c>=.55?"#BA7517":c>=.38?"#D85A30":"#993C1D";}

function pct(v){return Math.round(v*100)+'%';}

// ─── INDEXEDDB ENGINE ─────────────────────────────────────────────
async function initDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('sessions')){
        const s = d.createObjectStore('sessions',{keyPath:'id'});
        s.createIndex('ts','ts');
      }
      if(!d.objectStoreNames.contains('user')){
        d.createObjectStore('user',{keyPath:'key'});
      }
      if(!d.objectStoreNames.contains('merkle')){
        d.createObjectStore('merkle',{keyPath:'key'});
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}

async function dbPut(store, data){ return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(data).onsuccess=()=>res();tx.onerror=()=>rej(tx.error);});}
async function dbGet(store, key){ return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).get(key);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);});}
async function dbGetAll(store){ return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const req=tx.objectStore(store).getAll();req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);});}

async function getUser(){
  let u = await dbGet('user','profile');
  if(!u){
    u = {key:'profile', userId: crypto.randomUUID(), createdAt: Date.now(), sessionCount:0, consentGiven:false};
    await dbPut('user', u);
  }
  return u;
}

async function saveSessions(session){
  session.id = session.id || crypto.randomUUID();
  await dbPut('sessions', session);
  const u = await getUser();
  u.sessionCount = (u.sessionCount||0)+1;
  await dbPut('user', u);
}

async function getSessions(){
  return dbGetAll('sessions');
}

// ─── COMPUTATION ENGINE ───────────────────────────────────────────
function variance(arr){
  if(arr.length===0) return 0;
  const m=arr.reduce((a,b)=>a+b,0)/arr.length;
  return arr.reduce((a,b)=>a+(b-m)**2,0)/arr.length;
}
function stdDev(arr){ return Math.sqrt(variance(arr)); }
function clamp(v,lo,hi){ return Math.min(hi,Math.max(lo,v)); }

function computeCoherence(session){
  const {attention, emotion, responses, startTime} = session;

  // Anchor score (0-1)
  const anchorScore = (attention + emotion) / 10;

  // Rating consistency (ICC proxy)
  const ratings = responses.filter(r=>r.type==='rating').map(r=>r.value);
  const ratingVar = ratings.length > 1 ? stdDev(ratings)/4 : 0.5;
  const iccProxy = clamp(1 - ratingVar, 0, 1);

  // Response time score (CV of RTs)
  const rts = responses.map(r=>r.rt).filter(rt=>rt>500 && rt<30000);
  const rtCV = rts.length > 1 ? stdDev(rts)/Math.max(1,rts.reduce((a,b)=>a+b)/rts.length) : 0.5;
  const rtScore = clamp(1 - rtCV/2, 0, 1);

  // Gold task accuracy
  const goldResponses = responses.filter(r=>r.is_gold);
  let goldScore = 0.5; // default if no gold
  if(goldResponses.length > 0){
    let correct = 0;
    goldResponses.forEach(gr=>{
      if(gr.type==='pairwise' && gr.value === gr.gold_correct) correct++;
      else if(gr.type==='rating' && gr.gold_dir==='high' && gr.value>=4) correct++;
      else if(gr.type==='rating' && gr.gold_dir==='low' && gr.value<=2) correct++;
    });
    goldScore = correct / goldResponses.length;
  }

  // V1 formula (from whitepaper):
  // c = 0.30*anchor + 0.30*(1-ratingVar) + 0.25*rtScore + 0.15*goldScore
  const c = clamp(
    0.30*anchorScore + 0.30*iccProxy + 0.25*rtScore + 0.15*goldScore,
    0.05, 0.97
  );
  const w = getW(c);
  const confidence = clamp(0.4 + 0.06*Math.min(session.sessionNumber||1, 10), 0, 1);

  return {
    c: parseFloat(c.toFixed(3)),
    w: parseFloat(w.toFixed(3)),
    anchorScore: parseFloat(anchorScore.toFixed(3)),
    iccProxy: parseFloat(iccProxy.toFixed(3)),
    rtScore: parseFloat(rtScore.toFixed(3)),
    goldScore: parseFloat(goldScore.toFixed(3)),
    confidence: parseFloat(confidence.toFixed(3))
  };
}

// ─── MERKLE ENGINE ────────────────────────────────────────────────
async function sha256(str){
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest('SHA-256', enc.encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function buildMerkleTree(sessions){
  if(sessions.length===0) return {root:'0'.repeat(64), leaves:[], tree:[]};
  // Create leaf hashes
  const leaves = await Promise.all(sessions.map(s=>
    sha256(JSON.stringify({id:s.id, ts:s.ts, c:s.metrics.c, w:s.metrics.w}))
  ));
  // Build tree level by level
  let level = [...leaves];
  const tree = [level];
  while(level.length > 1){
    const next = [];
    for(let i=0; i<level.length; i+=2){
      const left = level[i];
      const right = level[i+1] || left;
      next.push(await sha256(left+right));
    }
    level = next;
    tree.push(level);
  }
  return {root: level[0], leaves, tree};
}

async function generateSignalPacket(session, prevC, merkleRoot){
  const deltaC = prevC !== null ? parseFloat((session.metrics.c - prevC).toFixed(3)) : null;
  const sessionHash = await sha256(JSON.stringify({id:session.id, ts:session.ts, c:session.metrics.c}));
  return {
    schema: "cwhf/1.0",
    c_weight: session.metrics.c,
    delta_c: deltaC,
    confidence: session.metrics.confidence,
    session_n: session.sessionNumber || 1,
    gold_accuracy: session.metrics.goldScore,
    merkle_root: merkleRoot || sessionHash.slice(0,16)+'...',
    context: "rlhf_annotation",
    lang: document.querySelector('.lang-sel').value || 'en',
    timestamp: new Date(session.ts).toISOString(),
    raw_data: null,
    privacy: "local_only"
  };
}

async function runComputation(){
  const log=document.getElementById('compute-log');
  const bar=document.getElementById('compute-bar');
  const steps=[
    [10,'Anchor score = ('+liveSession.attention+' + '+liveSession.emotion+') / 10 = '+((liveSession.attention+liveSession.emotion)/10).toFixed(2)],
    [25,'Rating variance = '+stdDev(liveSession.responses.filter(r=>r.type==='rating').map(r=>r.value)).toFixed(3)],
    [40,'ICC proxy = 1 - rating_std / 4 = '+clamp(1-stdDev(liveSession.responses.filter(r=>r.type==='rating').map(r=>r.value))/4,0,1).toFixed(3)],
    [55,'RT variance: '+(liveSession.responses.map(r=>r.rt))+'ms'],
    [70,'Gold task accuracy computed...'],
    [85,'Applying V1 formula: c = 0.30*anchor + 0.30*icc + 0.25*rt + 0.15*gold'],
    [95,'Building Merkle leaf hash (SHA-256)...'],
    [100,'Complete.']
  ];
  for(const [pct,msg] of steps){
    await new Promise(r=>setTimeout(r,350+Math.random()*200));
    if(log)log.textContent=msg;
    if(bar)bar.style.width=pct+'%';
  }
  // Run real computation
  const sessions=await getSessions();
  liveSession.sessionNumber=sessions.length+1;
  liveSession.metrics=computeCoherence(liveSession);
  const prevSession=sessions.length>0?sessions[sessions.length-1]:null;
  liveSession.prevC=prevSession?prevSession.metrics.c:null;
  liveSession.deltaC=prevSession?parseFloat((liveSession.metrics.c-prevSession.metrics.c).toFixed(3)):null;
  // Build Merkle leaf
  const allSessions=[...sessions,liveSession];
  const merkle=await buildMerkleTree(allSessions);
  liveSession.merkleRoot=merkle.root;
  liveSession.merkleLeaves=merkle.leaves;
  // Save to IndexedDB
  await saveSessions({
    id:liveSession.id,
    ts:liveSession.ts,
    anchor:{attention:liveSession.attention,emotion:liveSession.emotion},
    responses:liveSession.responses,
    metrics:liveSession.metrics,
    deltaC:liveSession.deltaC,
    sessionNumber:liveSession.sessionNumber,
    merkleRoot:liveSession.merkleRoot
  });
  renderLiveStep(5);
}

function formatPacket(p){
  const j=JSON.stringify(p,null,2);
  return j.replace(/"(\w+)":/g,'<span class="pk">"$1":</span>')
    .replace(/: "(.*?)"/g,': <span class="pv">"$1"</span>')
    .replace(/: ([\d.]+)/g,': <span class="ps">$1</span>')
    .replace(/: null/g,': <span style="color:#7EE787">null</span>');
}

async function dlPacket(){
  const sessions=await getSessions();
  const prevC=sessions.length>1?sessions[sessions.length-2].metrics.c:null;
  const packet=await generateSignalPacket({id:liveSession.id,ts:liveSession.ts,metrics:liveSession.metrics,sessionNumber:liveSession.sessionNumber,merkleRoot:liveSession.merkleRoot},prevC,liveSession.merkleRoot);

  a.href=URL.createObjectURL(new Blob([JSON.stringify(packet,null,2)],{type:'application/json'}));
  a.download=`cwhf_signal_${Date.now()}.json`;a.click();

}

      <td class="${s.deltaC>0?'delta-pos':s.deltaC<0?'delta-neg':'delta-neu'};font-weight:600">${s.deltaC!==null?(s.deltaC>=0?'+':'')+s.deltaC.toFixed(3):'—'}</td>
      <td>${s.metrics.w.toFixed(3)}</td>
      <td style="font-family:monospace;font-size:10px;color:var(--t3)">${s.merkleRoot?.slice(0,12)||'—'}...</td>
    </tr>`).join('')}</tbody>
  </table>`;
}

async function dlAllPackets(){
  const sessions=await getSessions();
  const packets=[];
  for(let i=0;i<sessions.length;i++){
    const prev=i>0?sessions[i-1].metrics.c:null;
    const p=await generateSignalPacket(sessions[i],prev,sessions[i].merkleRoot);
    packets.push(p);
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({schema:'cwhf/1.0',packets},null,2)],{type:'application/json'}));
  a.download=`cwhf_signal_packets_${Date.now()}.json`;a.click();
  notify('Signal packets exported. Raw data stayed on your device.');
}

async function dlFullData(){
  const sessions=await getSessions();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({warning:'FULL LOCAL DATA — do not share. Contains raw responses.',sessions},null,2)],{type:'application/json'}));
  a.download=`cwhf_full_local_${Date.now()}.json`;a.click();
}

async function mockH1Contribute(){
  const sessions=await getSessions();
  if(sessions.length===0){alert('Run at least one live session first.');return;}
  const packets=[];
  for(let i=0;i<sessions.length;i++){
    const prev=i>0?sessions[i-1].metrics.c:null;
    packets.push(await generateSignalPacket(sessions[i],prev,sessions[i].merkleRoot));
  }
  const merkle=await buildMerkleTree(sessions);
  notify(`✅ Mock H1 contribution: ${sessions.length} packet(s) with Merkle root ${merkle.root.slice(0,12)}... — No raw data sent.`, 5000);
}
